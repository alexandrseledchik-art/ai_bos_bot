<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>AI-BOSS Admin</title>
    <link rel="stylesheet" href="/admin-assets/styles.css?v=20260503-3">
  </head>
  <body>
    <main class="shell">
      <header class="topbar">
        <div>
          <p class="eyebrow">AI-BOSS</p>
          <h1>Контроль качества</h1>
        </div>
        <button class="ghost" id="logoutButton" type="button">Сбросить токен</button>
      </header>

      <section class="token-panel" id="tokenPanel">
        <h2>Вход в админку</h2>
        <p>Вставь admin token из Vercel env `ADMIN_DASHBOARD_TOKEN`.</p>
        <form id="tokenForm" class="token-form">
          <input
            id="tokenInput"
            name="token"
            type="password"
            autocomplete="off"
            autocapitalize="off"
            autocorrect="off"
            spellcheck="false"
            inputmode="text"
            placeholder="ADMIN_DASHBOARD_TOKEN"
          >
          <button class="secondary" id="pasteTokenButton" type="button">Вставить токен</button>
          <button type="submit">Открыть</button>
        </form>
        <p class="hint" id="tokenHint">Можно вставить через кнопку или обычным Cmd/Ctrl+V.</p>
      </section>

      <section class="workspace" id="workspace" hidden>
        <nav class="tabs" aria-label="Разделы админки">
          <button class="tab active" data-view="conversations" type="button">Диалоги</button>
          <button class="tab" data-view="evaluations" type="button">Оценки</button>
          <button class="tab" data-view="improvements" type="button">Улучшения</button>
        </nav>

        <section class="panel" id="content"></section>
      </section>
    </main>

    <script type="module" src="/admin-assets/src/main.js?v=20260503-3"></script>
  </body>
</html>
